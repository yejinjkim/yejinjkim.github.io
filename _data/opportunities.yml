reasons:
  - title: "Health is one of humanity's greatest challenges."
    body: "Advancing healthcare is one of the most impactful contributions a researcher can make. AI-driven innovations have the potential to transform medicine, from precision diagnostics to personalized treatments. Our group works at the forefront of AI-powered biomedical research."
  - title: "A globally recognized institution."
    body: "McWilliams School of Biomedical Informatics at UTHealth is ranked #2 worldwide in biomedical informatics. We work at the intersection of computational science and healthcare, on applications with real-world impact."
  - title: "Unmatched access to biomedical data."
    body: "UTHealth is located in the Texas Medical Center (TMC), the largest medical center in the world. This gives us access to high-quality biomedical datasets, a critical foundation for advancing AI in medicine."
  - title: "A thriving research hub."
    body: "Texas has the second-largest economy in the U.S., and Houston is the fifth-largest U.S. city with a comparatively low cost of living. The region is a hub for biotech, AI, and medical research, fostering interdisciplinary collaboration."

openings:
  - title: "Graduate students"
    body: "We always welcome highly motivated and self-driven graduate students to join our group. Graduate research assistants will be paid stipend generously to fully cover tuitions and living expenses. High priority will be given to students with strong computational background (e.g., computer science, statistics, mathematics) and proven track records of research interest (publication, conference presentation, etc)."
    steps:
      - "Apply to McWilliams School of Biomedical Informatics (due July 1 for Spring, December 1 for Fall admission)."
      - "Email me directly with your CV and research interests."
  - title: "Postdoctoral fellows"
    body: "We are actively recruiting talented postdoctoral fellows with strong motivation and proven track records. Postdoctoral fellow will be paid based on NIH guidelines. Candidate must hold Ph.D in computational background (e.g., computer science, statistics, data science, mathematics, and biomedical informatics) and have strong publications records."
  - title: "Internships"
    body: "We provide a paid summer internship position for those who can actively participate in research long term and ultimately plan to apply for our school."
