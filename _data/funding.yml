- id: "NIH R01AG084637"
  role: "PI"
  duration: "07/2024 - 06/2029"
  title: "Data-driven Subtypes of Alzheimer's disease progression for targeted treatment"
  description: "Identify subgroups of patients showing similar progression patterns across multimodal data, including cognitive function, brain atrophy, and biomarkers, by harmonizing multiple completed clinical trial data."

- id: "NIH R01AG082721"
  role: "PI"
  duration: "09/2023 - 05/2029"
  title: "Harmonizing multiple clinical trials for Alzheimer's disease to investigate differential responses to treatment via federated counterfactual learning"
  description: "Develop machine learning models to identify patient subgroups who respond differently to treatments, resulting in smaller, less expensive, and more targeted Alzheimer's disease clinical trials."

- id: "NIH U24AG098157"
  role: "Co-I"
  duration: "09/2025 - 08/2030"
  title: "ReCARDO: Using Real-World Data to Derive Common Data Elements for Alzheimer's Disease and AD-Related Dementias"
  description: "Establish a ten-institution research network and an AD/ADRD-focused collaborative data ecosystem incorporating common data elements and real-world data."

- id: "NIH R01HD120995-01"
  role: "Co-I"
  duration: "07/2026 - 06/2030"
  title: "Defining, Validating, & Endotyping Phenotypes in BPD"
  description: "Define and validate clinically and biologically meaningful subgroups of bronchopulmonary dysplasia in preterm infants using large-scale neonatal datasets and transcriptomic data."

- id: "NIH R01NR22258"
  role: "Site PI"
  duration: "04/2026 - 03/2030"
  title: "An Artificial Intelligence Approach to Understanding Trade-offs in Emergency Department Decision-Making"
  description: "Develop an evaluation framework for emergency department decision-making and use it to assess AI models designed to support rapid and accurate ED decisions."

- id: "Robert Wood Johnson Foundation"
  role: "PI (completed)"
  duration: "09/2019 - 09/2021"
  title: "Computational Phenotyping to Better Understand Obesity"
  description: "Develop a dynamic pattern mining model to identify trends and patterns of weight gain (temporal phenotyping) most likely to be diabetic."

- id: "NIH R01AG066749-03S1"
  role: "MPI (completed)"
  duration: "09/2022 - 08/2023"
  title: "Finding combinatorial drug repositioning therapy for Alzheimer's disease and related dementias"
  description: "Develop novel machine learning solutions to mitigate algorithmic unfairness by addressing data biases."
